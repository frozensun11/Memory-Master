<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statehood Memory Master</title>
<style>
:root{
  --paper:#E8E2D0;
  --ink:#22303F;
  --route:#B33A3A;
  --federal:#2C5F8A;
  --gold:#C9A227;
  --mastered:#3E7A4E;
  --card:#FDFBF4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:Georgia,'Times New Roman',serif;
  background:var(--paper);
  background-image:
    linear-gradient(rgba(44,95,138,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(44,95,138,.06) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  min-height:100vh;
  padding-bottom:60px;
}
header{
  text-align:center;
  padding:24px 16px 10px;
}
header h1{
  font-size:clamp(1.5rem,4.5vw,2.3rem);
  letter-spacing:.04em;
}
header h1 span{color:var(--route);}
header .sub{
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.8rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--federal);
  margin-top:4px;
}
nav{
  display:flex;
  justify-content:center;
  gap:6px;
  flex-wrap:wrap;
  padding:14px 10px;
  position:sticky;
  top:0;
  background:var(--paper);
  z-index:10;
  border-bottom:2px solid var(--ink);
}
nav button{
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.85rem;
  letter-spacing:.06em;
  padding:9px 16px;
  border:2px solid var(--ink);
  background:var(--card);
  color:var(--ink);
  cursor:pointer;
  border-radius:4px;
}
nav button.active{background:var(--ink);color:var(--card);}
main{max-width:880px;margin:0 auto;padding:18px 14px;}
.hidden{display:none;}

/* Era chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chips button{
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.78rem;
  padding:7px 12px;
  border:1.5px solid var(--federal);
  background:var(--card);
  color:var(--federal);
  border-radius:20px;
  cursor:pointer;
}
.chips button.on{background:var(--federal);color:#fff;}

/* Stamp cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.stamp{
  background-color:var(--card);
  background-image:radial-gradient(var(--paper) 3.5px, transparent 3.5px);
  background-size:14px 14px;
  background-position:-7px -7px;
  padding:8px;
  border-radius:3px;
  box-shadow:2px 3px 6px rgba(34,48,63,.18);
}
.stamp-inner{
  background:var(--card);
  border:1.5px solid var(--ink);
  padding:12px;
  height:100%;
  position:relative;
  display:flex;
  gap:12px;
  align-items:flex-start;
}
.stamp.mastered .stamp-inner{border-color:var(--mastered);}
.ordinal{
  flex:0 0 auto;
  text-align:center;
  border:2px solid var(--route);
  color:var(--route);
  border-radius:50%;
  width:56px;height:56px;
  display:flex;flex-direction:column;justify-content:center;
  transform:rotate(-8deg);
  font-family:'Trebuchet MS',Verdana,sans-serif;
}
.stamp.mastered .ordinal{border-color:var(--mastered);color:var(--mastered);}
.ordinal .num{font-size:1.25rem;font-weight:bold;line-height:1;}
.ordinal .lbl{font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;}
.stamp h3{font-size:1.02rem;}
.stamp .year{
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.75rem;color:var(--federal);
  margin:2px 0 4px;letter-spacing:.05em;
}
.stamp .hook{font-size:.85rem;font-style:italic;line-height:1.35;}
.stamp .cap{font-size:.78rem;margin-top:5px;font-family:'Trebuchet MS',Verdana,sans-serif;color:var(--ink);opacity:.8;}
.mast-tag{
  position:absolute;top:6px;right:6px;
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mastered);border:1px solid var(--mastered);
  padding:2px 5px;border-radius:3px;transform:rotate(6deg);
}
.era-head{
  margin:20px 0 10px;
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink);
  border-bottom:1.5px solid var(--ink);
  padding-bottom:5px;
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;
}
.era-head .range{color:var(--route);}

/* Quiz */
.qcard{
  background-color:var(--card);
  background-image:radial-gradient(var(--paper) 3.5px, transparent 3.5px);
  background-size:14px 14px;background-position:-7px -7px;
  padding:10px;border-radius:3px;
  box-shadow:2px 3px 8px rgba(34,48,63,.2);
  max-width:600px;margin:0 auto;
}
.qcard-inner{background:var(--card);border:1.5px solid var(--ink);padding:20px;}
.qmeta{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--federal);margin-bottom:12px;
}
.qtext{font-size:1.25rem;margin-bottom:18px;line-height:1.35;}
.opts{display:grid;gap:10px;}
.opts button{
  font-family:Georgia,serif;font-size:1rem;
  text-align:left;padding:12px 14px;
  border:1.5px solid var(--ink);background:var(--card);
  cursor:pointer;border-radius:4px;color:var(--ink);
}
.opts button:hover{background:#F1ECDD;}
.opts button.right{background:var(--mastered);border-color:var(--mastered);color:#fff;}
.opts button.wrong{background:var(--route);border-color:var(--route);color:#fff;}
.opts button:disabled{cursor:default;}
.feedback{
  margin-top:16px;padding:12px 14px;
  border-left:4px solid var(--gold);
  background:#F5EFDD;font-size:.92rem;line-height:1.4;
}
.feedback strong{color:var(--route);}
.nextbtn,.bigbtn{
  display:block;margin:18px auto 0;
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.95rem;letter-spacing:.06em;
  padding:11px 26px;border:2px solid var(--ink);
  background:var(--ink);color:var(--card);
  cursor:pointer;border-radius:4px;
}
.streak{
  text-align:center;margin-top:14px;
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.8rem;color:var(--ink);letter-spacing:.08em;
}

/* Timeline */
.tl-pool,.tl-slots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:48px;}
.tl-chip{
  font-family:Georgia,serif;font-size:.92rem;
  padding:10px 14px;border:1.5px solid var(--federal);
  background:var(--card);cursor:pointer;border-radius:4px;color:var(--ink);
}
.tl-slot{
  padding:10px 14px;border:1.5px dashed var(--ink);
  border-radius:4px;min-width:110px;font-size:.92rem;
  font-family:Georgia,serif;background:rgba(253,251,244,.6);
}
.tl-slot.filled{border-style:solid;background:var(--card);cursor:pointer;}
.tl-slot .slotnum{
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.6rem;color:var(--route);letter-spacing:.1em;display:block;
}
.tl-result{margin-top:14px;font-size:1rem;text-align:center;min-height:24px;}
.tl-result.good{color:var(--mastered);}
.tl-result.bad{color:var(--route);}

/* Progress */
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
.pstat{
  background:var(--card);border:1.5px solid var(--ink);
  padding:14px;text-align:center;border-radius:4px;
}
.pstat .big{font-size:1.7rem;color:var(--route);font-weight:bold;}
.pstat .lbl{font-family:'Trebuchet MS',Verdana,sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;}
.bar-row{margin-bottom:14px;}
.bar-row .bl{
  display:flex;justify-content:space-between;
  font-family:'Trebuchet MS',Verdana,sans-serif;
  font-size:.75rem;letter-spacing:.06em;margin-bottom:4px;
}
.bar{height:14px;background:var(--card);border:1.5px solid var(--ink);border-radius:7px;overflow:hidden;}
.bar div{height:100%;background:var(--mastered);width:0;transition:width .5s;}
.reset{
  margin-top:26px;background:var(--card);color:var(--route);
  border:1.5px solid var(--route);font-size:.8rem;
  font-family:'Trebuchet MS',Verdana,sans-serif;
  padding:8px 16px;border-radius:4px;cursor:pointer;display:block;
}
.note{font-size:.85rem;font-style:italic;opacity:.75;margin-top:8px;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<header>
  <h1>Statehood <span>Memory Master</span></h1>
  <div class="sub">All 50 states &middot; their number &middot; their year &middot; their story</div>
</header>

<nav>
  <button data-tab="learn" class="active">📚 Learn</button>
  <button data-tab="quiz">⚡ Quiz</button>
  <button data-tab="timeline">🔢 Timeline</button>
  <button data-tab="progress">🏆 Progress</button>
</nav>

<main>
  <section id="tab-learn">
    <div class="chips" id="learn-chips"></div>
    <div id="learn-body"></div>
  </section>

  <section id="tab-quiz" class="hidden">
    <div class="chips" id="quiz-chips"></div>
    <div class="qcard"><div class="qcard-inner">
      <div class="qmeta"><span id="q-type"></span><span id="q-count"></span></div>
      <div class="qtext" id="q-text"></div>
      <div class="opts" id="q-opts"></div>
      <div class="feedback hidden" id="q-fb"></div>
      <button class="nextbtn hidden" id="q-next">Next question →</button>
    </div></div>
    <div class="streak" id="q-streak"></div>
  </section>

  <section id="tab-timeline" class="hidden">
    <div class="chips" id="tl-chips"></div>
    <div class="qcard"><div class="qcard-inner">
      <div class="qmeta"><span>Timeline Challenge</span><span>Tap states in admission order</span></div>
      <div class="tl-slots" id="tl-slots"></div>
      <div class="tl-pool" id="tl-pool"></div>
      <div class="tl-result" id="tl-result"></div>
      <button class="bigbtn" id="tl-new">New round</button>
    </div></div>
  </section>

  <section id="tab-progress" class="hidden">
    <div class="pstats" id="p-stats"></div>
    <div id="p-bars"></div>
    <button class="reset" id="p-reset">Reset all progress</button>
    <p class="note">Progress saves on this device between sessions once the app is deployed or opened as a file.</p>
  </section>
</main>

<script>
/* ---------- Data ---------- */
const ERAS = [
  {id:'e1', name:'The Original Thirteen', range:'1787–1790', lo:1, hi:13},
  {id:'e2', name:'The Young Republic',    range:'1791–1821', lo:14, hi:24},
  {id:'e3', name:'Expansion & Compromise',range:'1836–1859', lo:25, hi:33},
  {id:'e4', name:'War & Reunion',         range:'1861–1876', lo:34, hi:38},
  {id:'e5', name:'Closing the Frontier',  range:'1889–1896', lo:39, hi:45},
  {id:'e6', name:'The Modern Map',        range:'1907–1959', lo:46, hi:50},
];

const STATES = [
[1,'Delaware',1787,'Dover','The First State — raced to ratify before anyone else.'],
[2,'Pennsylvania',1787,'Harrisburg','Home of Independence Hall — second, by just five days.'],
[3,'New Jersey',1787,'Trenton','Crossroads of the Revolution; ratified unanimously.'],
[4,'Georgia',1788,'Atlanta','Southernmost of the original colonies, first in the new year.'],
[5,'Connecticut',1788,'Hartford','The Constitution State — its Great Compromise shaped Congress.'],
[6,'Massachusetts',1788,'Boston','Said yes only after demanding a Bill of Rights.'],
[7,'Maryland',1788,'Annapolis','Later donated the land that became Washington, D.C.'],
[8,'South Carolina',1788,'Columbia','Eighth to join — and, decades later, the first to secede.'],
[9,'New Hampshire',1788,'Concord','The clincher: the ninth "yes" made the Constitution official.'],
[10,'Virginia',1788,'Richmond','The big one — home of Washington, Jefferson, and Madison.'],
[11,'New York',1788,'Albany','Ratified by three votes after the Federalist Papers campaign.'],
[12,'North Carolina',1789,'Raleigh','Held out until the Bill of Rights was on its way.'],
[13,'Rhode Island',1790,'Providence','Smallest and stubbornest — last of the original thirteen.'],
[14,'Vermont',1791,'Montpelier','An independent republic for 14 years before joining.'],
[15,'Kentucky',1792,'Frankfort','First state west of the Appalachians — carved from Virginia.'],
[16,'Tennessee',1796,'Nashville','First state formed from federal territory — the Volunteer State.'],
[17,'Ohio',1803,'Columbus','Gateway to the old Northwest — Congress forgot to finish the paperwork until 1953.'],
[18,'Louisiana',1812,'Baton Rouge','First state from the Louisiana Purchase, weeks before the War of 1812.'],
[19,'Indiana',1816,'Indianapolis','The Hoosier State, admitted as the war years wound down.'],
[20,'Mississippi',1817,'Jackson','A cotton kingdom rising along the river that named it.'],
[21,'Illinois',1818,'Springfield','The Prairie State — Lincoln\u2019s political home.'],
[22,'Alabama',1819,'Montgomery','Completed the Deep South\u2019s cotton belt.'],
[23,'Maine',1820,'Augusta','Split from Massachusetts as the free half of the Missouri Compromise.'],
[24,'Missouri',1821,'Jefferson City','The slave-state half of the Compromise — the pair kept the balance.'],
[25,'Arkansas',1836,'Little Rock','Paired with Michigan to keep the slave/free balance even.'],
[26,'Michigan',1837,'Lansing','Traded Toledo in a border war for the Upper Peninsula — great deal.'],
[27,'Florida',1845,'Tallahassee','Bought from Spain; admitted the same year as Texas.'],
[28,'Texas',1845,'Austin','An independent republic for nine years before annexation.'],
[29,'Iowa',1846,'Des Moines','First free state carved from the Louisiana Purchase.'],
[30,'Wisconsin',1848,'Madison','Rounded out the old Northwest — its "badgers" were lead miners.'],
[31,'California',1850,'Sacramento','The Gold Rush fast-tracked it — skipped territory status entirely.'],
[32,'Minnesota',1858,'Saint Paul','Land of 10,000 lakes, joined as the Union began to fray.'],
[33,'Oregon',1859,'Salem','End of the Oregon Trail — admitted on Valentine\u2019s Day.'],
[34,'Kansas',1861,'Topeka','"Bleeding Kansas" entered free just weeks before the Civil War.'],
[35,'West Virginia',1863,'Charleston','Broke away from Virginia mid-war to stay in the Union.'],
[36,'Nevada',1864,'Carson City','"Battle Born" — rushed in to back Lincoln\u2019s re-election.'],
[37,'Nebraska',1867,'Lincoln','First state admitted after the Civil War — over a presidential veto.'],
[38,'Colorado',1876,'Denver','The Centennial State — 100 years after the Declaration.'],
[39,'North Dakota',1889,'Bismarck','President Harrison shuffled the papers so no one knows which Dakota was signed first.'],
[40,'South Dakota',1889,'Pierre','The other Dakota — admitted the very same day.'],
[41,'Montana',1889,'Helena','Big Sky copper country — third of four states in one November.'],
[42,'Washington',1889,'Olympia','Fourth state in nine days — the great statehood rush of 1889.'],
[43,'Idaho',1890,'Boise','The Gem State, admitted on the 3rd of July.'],
[44,'Wyoming',1890,'Cheyenne','First state where women could vote — and it refused to join without it.'],
[45,'Utah',1896,'Salt Lake City','Waited decades — admitted after polygamy was renounced.'],
[46,'Oklahoma',1907,'Oklahoma City','Twin territories merged, with a land-run legacy.'],
[47,'New Mexico',1912,'Santa Fe','Its capital is the oldest capital city in the U.S.'],
[48,'Arizona',1912,'Phoenix','Last of the lower 48 — admitted on Valentine\u2019s Day 1912.'],
[49,'Alaska',1959,'Juneau','Seward\u2019s "Folly" finally paid off — the biggest state by far.'],
[50,'Hawaii',1959,'Honolulu','The 50th star and the only island state.'],
].map(a=>({n:a[0],name:a[1],year:a[2],cap:a[3],hook:a[4]}));

const byN = {}; STATES.forEach(s=>byN[s.n]=s);
function eraOf(n){return ERAS.find(e=>n>=e.lo && n<=e.hi);}

/* ---------- Storage (safe: falls back to in-memory) ---------- */
const store = (function(){
  try{ const t='__smm_t'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];}}; }
})();

let S;
function loadS(){
  try{ S = JSON.parse(store.getItem('smm_state')) || {}; }catch(e){ S = {}; }
  S.boxes = S.boxes || {};        // state# -> Leitner box 1..5
  S.qcount = S.qcount || 0;
  S.streak = S.streak || 0;
  S.best = S.best || 0;
  S.right = S.right || 0;
  S.answered = S.answered || 0;
}
function saveS(){ store.setItem('smm_state', JSON.stringify(S)); }
loadS();

function box(n){ return S.boxes[n] || 1; }
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- Tabs ---------- */
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    ['learn','quiz','timeline','progress'].forEach(t=>{
      document.getElementById('tab-'+t).classList.toggle('hidden', t!==b.dataset.tab);
    });
    if(b.dataset.tab==='progress') renderProgress();
    if(b.dataset.tab==='quiz' && !quizActive) nextQuestion();
    if(b.dataset.tab==='timeline' && !tlStarted) newTimeline();
  });
});

/* ---------- Era chips (shared builder) ---------- */
function buildChips(elId, current, onPick, allowAll){
  const el = document.getElementById(elId);
  el.innerHTML = '';
  const mk = (id,label)=>{
    const b=document.createElement('button');
    b.textContent=label;
    if(id===current) b.classList.add('on');
    b.addEventListener('click',()=>onPick(id));
    el.appendChild(b);
  };
  if(allowAll) mk('all','All eras');
  ERAS.forEach(e=>mk(e.id, e.name));
}

/* ---------- Learn ---------- */
let learnEra = 'e1';
function stampHTML(s){
  const m = box(s.n)>=4;
  return `<div class="stamp ${m?'mastered':''}"><div class="stamp-inner">
    ${m?'<span class="mast-tag">Mastered</span>':''}
    <div class="ordinal"><span class="num">${s.n}</span><span class="lbl">State</span></div>
    <div>
      <h3>${s.name}</h3>
      <div class="year">Admitted ${s.year}</div>
      <div class="hook">${s.hook}</div>
      <div class="cap">★ Capital: ${s.cap}</div>
    </div>
  </div></div>`;
}
function renderLearn(){
  buildChips('learn-chips', learnEra, id=>{learnEra=id;renderLearn();}, false);
  const e = ERAS.find(x=>x.id===learnEra);
  const list = STATES.filter(s=>s.n>=e.lo && s.n<=e.hi);
  document.getElementById('learn-body').innerHTML =
    `<div class="era-head"><span>${e.name}</span><span class="range">${e.range} · States ${e.lo}–${e.hi}</span></div>
     <div class="grid">${list.map(stampHTML).join('')}</div>`;
}

/* ---------- Quiz ---------- */
let quizEra = 'all', quizActive = false, curQ = null;
const QTYPES = ['name2num','num2name','year','successor','cap2state','state2cap'];

function scopeStates(){
  if(quizEra==='all') return STATES;
  const e = ERAS.find(x=>x.id===quizEra);
  return STATES.filter(s=>s.n>=e.lo && s.n<=e.hi);
}
function weightedPick(){
  const pool = scopeStates();
  const weights = pool.map(s=>Math.max(1, 6-box(s.n)));   // low box = seen more
  let total = weights.reduce((a,b)=>a+b,0), r = Math.random()*total;
  for(let i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function distinct(s, k, keyFn){
  const seen = new Set([keyFn(s)]);
  const out = [];
  for(const c of shuffle(STATES)){
    const key = keyFn(c);
    if(c.n!==s.n && !seen.has(key)){ seen.add(key); out.push(c); if(out.length===k) break; }
  }
  return out;
}
function yearOptions(s){
  const opts = new Set([s.year]);
  const offsets = shuffle([-3,-2,-1,1,2,3,4,-4,5,-5,7,-7,10,-10]);
  for(const o of offsets){ if(opts.size>=4) break; const y=s.year+o; if(y>=1787 && y<=1959) opts.add(y); }
  return shuffle([...opts]);
}
function buildQuestion(s){
  let types = QTYPES.slice();
  if(s.n===50) types = types.filter(t=>t!=='successor');
  const t = types[Math.floor(Math.random()*types.length)];
  let text, opts, correct, typeLbl;

  if(t==='name2num'){
    typeLbl='Name → Number';
    text=`What number state is <strong>${s.name}</strong>?`;
    correct='#'+s.n;
    const near = distinct(s,3,x=>x.n).map(x=>'#'+x.n);
    opts = shuffle([correct, ...near]);
  } else if(t==='num2name'){
    typeLbl='Number → Name';
    text=`Which state was admitted <strong>#${s.n}</strong>?`;
    correct=s.name;
    opts = shuffle([s.name, ...distinct(s,3,x=>x.name).map(x=>x.name)]);
  } else if(t==='year'){
    typeLbl='Admission Year';
    text=`What year did <strong>${s.name}</strong> become a state?`;
    correct=String(s.year);
    opts = yearOptions(s).map(String);
  } else if(t==='successor'){
    typeLbl='Who Came Next';
    const nxt = byN[s.n+1];
    text=`Which state was admitted right after <strong>${s.name}</strong> (#${s.n})?`;
    correct=nxt.name;
    opts = shuffle([nxt.name, ...distinct(nxt,3,x=>x.name).map(x=>x.name)]);
  } else if(t==='cap2state'){
    typeLbl='Capital → State';
    text=`Which state\u2019s capital is <strong>${s.cap}</strong>?`;
    correct=s.name;
    opts = shuffle([s.name, ...distinct(s,3,x=>x.name).map(x=>x.name)]);
  } else {
    typeLbl='State → Capital';
    text=`What is the capital of <strong>${s.name}</strong>?`;
    correct=s.cap;
    opts = shuffle([s.cap, ...distinct(s,3,x=>x.cap).map(x=>x.cap)]);
  }
  return {s,t,text,opts,correct,typeLbl};
}
function nextQuestion(){
  quizActive = true;
  buildChips('quiz-chips', quizEra, id=>{quizEra=id;nextQuestion();}, true);
  curQ = buildQuestion(weightedPick());
  S.qcount++; saveS();
  document.getElementById('q-type').textContent = curQ.typeLbl;
  document.getElementById('q-count').textContent = 'Question '+S.qcount;
  document.getElementById('q-text').innerHTML = curQ.text;
  document.getElementById('q-fb').classList.add('hidden');
  document.getElementById('q-next').classList.add('hidden');
  const box_ = document.getElementById('q-opts');
  box_.innerHTML='';
  curQ.opts.forEach(o=>{
    const b=document.createElement('button');
    b.innerHTML=o;
    b.addEventListener('click',()=>answer(b,o));
    box_.appendChild(b);
  });
  updStreak();
}
function answer(btn, choice){
  const right = choice===curQ.correct;
  document.querySelectorAll('#q-opts button').forEach(b=>{
    b.disabled=true;
    if(b.innerHTML===curQ.correct) b.classList.add('right');
  });
  if(!right) btn.classList.add('wrong');

  const s = (curQ.t==='successor') ? byN[curQ.s.n+1] : curQ.s;
  const cur = box(s.n);
  S.boxes[s.n] = right ? Math.min(5, cur+1) : 1;
  S.answered++;
  if(right){ S.right++; S.streak++; S.best=Math.max(S.best,S.streak); }
  else S.streak=0;
  saveS();

  const fb = document.getElementById('q-fb');
  fb.classList.remove('hidden');
  fb.innerHTML = (right?'✅ Correct! ':'❌ Not quite. ')+
    `<strong>${s.name}</strong> — #${s.n}, admitted ${s.year}. Capital: ${s.cap}.<br><em>${s.hook}</em>`+
    (right?'':' <br><span style="font-size:.8rem;">(Back to box 1 — it\u2019ll come around again soon.)</span>');
  document.getElementById('q-next').classList.remove('hidden');
  updStreak();
}
function updStreak(){
  document.getElementById('q-streak').textContent =
    `🔥 Streak: ${S.streak}   ·   Best: ${S.best}   ·   Accuracy: ${S.answered? Math.round(100*S.right/S.answered):0}%`;
}
document.getElementById('q-next').addEventListener('click', nextQuestion);

/* ---------- Timeline ---------- */
let tlEra='all', tlStarted=false, tlPick=[], tlPlaced=[];
function newTimeline(){
  tlStarted=true;
  buildChips('tl-chips', tlEra, id=>{tlEra=id;newTimeline();}, true);
  const pool = tlEra==='all' ? STATES : (()=>{const e=ERAS.find(x=>x.id===tlEra);return STATES.filter(s=>s.n>=e.lo&&s.n<=e.hi);})();
  tlPick = shuffle(pool).slice(0,5);
  tlPlaced = new Array(5).fill(null);
  document.getElementById('tl-result').textContent='';
  document.getElementById('tl-result').className='tl-result';
  renderTimeline();
}
function renderTimeline(){
  const slots=document.getElementById('tl-slots');
  slots.innerHTML='';
  tlPlaced.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='tl-slot'+(p?' filled':'');
    d.innerHTML=`<span class="slotnum">${i===0?'Earliest':(i===4?'Latest':'&nbsp;')}</span>${p?p.name:'—'}`;
    if(p) d.addEventListener('click',()=>{tlPlaced[i]=null;renderTimeline();});
    slots.appendChild(d);
  });
  const poolEl=document.getElementById('tl-pool');
  poolEl.innerHTML='';
  tlPick.filter(s=>!tlPlaced.includes(s)).forEach(s=>{
    const b=document.createElement('button');
    b.className='tl-chip';
    b.textContent=s.name;
    b.addEventListener('click',()=>{
      const i=tlPlaced.indexOf(null);
      if(i>-1){ tlPlaced[i]=s; renderTimeline(); if(!tlPlaced.includes(null)) checkTimeline(); }
    });
    poolEl.appendChild(b);
  });
}
function checkTimeline(){
  const sorted = tlPick.slice().sort((a,b)=>a.n-b.n);
  const ok = tlPlaced.every((p,i)=>p.n===sorted[i].n);
  const r=document.getElementById('tl-result');
  if(ok){
    r.textContent='✅ Perfect order! '+sorted.map(s=>`${s.name} (#${s.n})`).join(' → ');
    r.className='tl-result good';
  }else{
    r.textContent='❌ Correct order: '+sorted.map(s=>`${s.name} (#${s.n}, ${s.year})`).join(' → ');
    r.className='tl-result bad';
  }
}
document.getElementById('tl-new').addEventListener('click', newTimeline);

/* ---------- Progress ---------- */
function renderProgress(){
  const mastered = STATES.filter(s=>box(s.n)>=4).length;
  document.getElementById('p-stats').innerHTML = `
    <div class="pstat"><div class="big">${mastered}/50</div><div class="lbl">States mastered</div></div>
    <div class="pstat"><div class="big">${S.answered? Math.round(100*S.right/S.answered):0}%</div><div class="lbl">Accuracy</div></div>
    <div class="pstat"><div class="big">${S.best}</div><div class="lbl">Best streak</div></div>
    <div class="pstat"><div class="big">${S.answered}</div><div class="lbl">Questions answered</div></div>`;
  document.getElementById('p-bars').innerHTML = ERAS.map(e=>{
    const list = STATES.filter(s=>s.n>=e.lo&&s.n<=e.hi);
    const m = list.filter(s=>box(s.n)>=4).length;
    const pct = Math.round(100*m/list.length);
    return `<div class="bar-row"><div class="bl"><span>${e.name}</span><span>${m}/${list.length}</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div></div>`;
  }).join('');
}
document.getElementById('p-reset').addEventListener('click',()=>{
  if(confirm('Reset all progress? This can\u2019t be undone.')){
    store.removeItem('smm_state'); loadS(); saveS(); renderProgress(); renderLearn();
  }
});

/* ---------- Init ---------- */
renderLearn();
</script>
